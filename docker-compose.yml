version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # !! 重要: 首次启动前务必修改 JWT_SECRET 为一个随机字符串 !!
      # 未提供时，系统会在持久化数据卷中自动生成随机密钥。
      - JWT_SECRET=${JWT_SECRET:-}
      # 可选；未提供时会生成一次性管理员密码文件。
      - IBD_BOOTSTRAP_ADMIN_PASSWORD=${IBD_BOOTSTRAP_ADMIN_PASSWORD:-}
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      # 飞书任务通知（凭证从未纳入版本控制的 .env 注入）
      - FEISHU_ENABLED=${FEISHU_ENABLED:-false}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_TASK_CHAT_ID=${FEISHU_TASK_CHAT_ID:-}
      - IBD_PUBLIC_URL=${IBD_PUBLIC_URL:-}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_AUTH_CODE=${SMTP_AUTH_CODE:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-GCO Link 任务助手}
    volumes:
      # 数据库文件持久化
      - app-data:/app/data
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
